services:
  - type: web
    name: romulus
    runtime: python
    rootDir: portal
    plan: starter
    buildCommand: python3 -m compileall -q .
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: ROMULUS_HOST
        value: 0.0.0.0
      - key: ROMULUS_DB_PATH
        value: /var/data/romulus.sqlite3
      - key: ROMULUS_COOKIE_SECURE
        value: "1"
    disk:
      name: romulus-data
      mountPath: /var/data
      sizeGB: 1
